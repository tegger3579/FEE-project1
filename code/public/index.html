<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Note App</title>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.3/handlebars.min.js"
      integrity="sha256-/PJBs6QWvXijOFIX04kZpLb6ZtSQckdOIavLWKKOgXU="
      crossorigin="anonymous"
    ></script>

    <script type="module" src="scripts/index.js"></script>

    <!-- Handlebar template for note list items -->
    <script id="note-template" type="text/x-handlebars-template">
      {{#each notes}}
        <li class="note-list__item" data-note-id="{{id}}">
          <div class="note-list__item-title">
            <h2 class="note-list__item-title-text">{{title}}</h2>
          </div>
          <div class="note-list__item-text">
            <p class="note-list__item-text-text">{{text}}</p>
          </div>
          <div class="note-list__item-meta">
            <span class="note-list__item-due-date">Due: {{dueDate}}</span>
            <label class="note-list__item-checkbox">
              <input type="checkbox" class="note-completed-toggle"
                data-note-id="{{id}}" {{#if completed}}checked{{/if}} disabled />
                Completed
            </label>
            <span class="note-list__item-importance">Importance:
              {{importance}}</span>
          </div>
          <button class="button-edit">Edit</button>
        </li>
      {{/each}}
    </script>

    <!-- Modal for adding/editing notes -->
    <div id="note-modal" class="modal">
      <div class="modal-content">
        <span class="modal-close">&times;</span>
        <h2 id="modal-title">Add New Note</h2>
        <form id="note-form">
          <div class="form-group">
            <label for="note-title">Title:</label>
            <input type="text" id="note-title" name="title" required />
          </div>
          <div class="form-group">
            <label for="note-text">Description:</label>
            <textarea id="note-text" name="text" rows="4" required></textarea>
          </div>
          <div class="form-group">
            <label for="note-due-date">Due Date:</label>
            <input type="date" id="note-due-date" name="dueDate" required />
          </div>
          <div class="form-group">
            <label for="note-importance">Importance (1-5):</label>
            <input
              type="number"
              id="note-importance"
              name="importance"
              min="1"
              max="5"
              required
            />
          </div>
          <div class="form-group checkbox-group">
            <label for="note-completed">
              <input
                type="checkbox"
                id="note-completed"
                name="completed"
              />Completed
            </label>
          </div>
          <button type="submit" class="button-save">Save Note</button>
        </form>
      </div>
    </div>

    <link rel="stylesheet" href="styles/index.css" />
  </head>
  <body>
    <h1>Note App</h1>
    <div class="top-bar">
      <button class="button-add">Add new Note</button>
      <button class="button-style">Change Style</button>
    </div>
    <div class="sort-filter-buttons">
      <button class="button-sort-name">By name</button>
      <button class="button-sort-due-date">By due date</button>
      <button class="button-sort-creation-date">By creation date</button>
      <button class="button-sort-importance">By importance</button>
      <button class="button-filter">Filter by Status</button>
    </div>
    <ul class="note-list__ul"></ul>
  </body>
</html>
